<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designation Vee — Portfolio</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --orange: #d29922;
      --purple: #bc8cff;
      --red: #f85149;
      --pink: #f778ba;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; transition: color .2s; }
    a:hover { color: var(--accent-hover); }

    /* ── Header ── */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 2rem 0;
    }
    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--border);
      flex-shrink: 0;
    }
    .header-info h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }
    .header-info .handle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .header-info .bio {
      margin-top: .5rem;
      color: var(--text-muted);
      font-style: italic;
    }
    .header-meta {
      display: flex;
      gap: 1.5rem;
      margin-top: .75rem;
      flex-wrap: wrap;
      font-size: .9rem;
      color: var(--text-muted);
    }
    .header-meta span { display: flex; align-items: center; gap: .35rem; }
    .header-meta svg { width: 16px; height: 16px; fill: var(--text-muted); }

    /* ── Nav ── */
    .nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem 1.5rem 0;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .45rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: .85rem;
      transition: all .2s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* ── Sections ── */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Repo Grid ── */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .repo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      transition: border-color .2s;
    }
    .repo-card:hover { border-color: var(--accent); }
    .repo-card .repo-name {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .repo-card .repo-name svg { width: 16px; height: 16px; fill: var(--text-muted); flex-shrink: 0; }
    .repo-card .repo-desc {
      color: var(--text-muted);
      font-size: .85rem;
      margin-top: .5rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .repo-card .repo-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: .75rem;
      font-size: .8rem;
      color: var(--text-muted);
    }
    .lang-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .repo-meta span { display: flex; align-items: center; gap: .3rem; }
    .repo-meta svg { width: 14px; height: 14px; fill: var(--text-muted); }
    .badge {
      font-size: .7rem;
      padding: .15rem .45rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-left: auto;
    }

    /* ── Stats Section ── */
    .stats-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      flex: 1;
      min-width: 140px;
      text-align: center;
    }
    .stat-card .stat-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .stat-label {
      font-size: .85rem;
      color: var(--text-muted);
      margin-top: .25rem;
    }

    /* ── Lang bar ── */
    .lang-bar-container { margin-bottom: 2rem; }
    .lang-bar {
      display: flex;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: .75rem;
    }
    .lang-legend {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      font-size: .8rem;
      color: var(--text-muted);
    }
    .lang-legend span { display: flex; align-items: center; gap: .3rem; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-muted);
      font-size: .85rem;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .header-inner { flex-direction: column; text-align: center; }
      .header-meta { justify-content: center; }
      .repo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <img class="avatar" src="https://avatars.githubusercontent.com/u/120316848?v=4" alt="Avatar">
      <div class="header-info">
        <h1>Designation Vee</h1>
        <div class="handle">@Senthemodder</div>
        <p class="bio">k? lang thang</p>
        <div class="header-meta">
          <span>
            <svg viewBox="0 0 16 16"><path d="M11.536 3.464a5 5 0 010 7.072L8 14.07l-3.536-3.535a5 5 0 117.072-7.072v.001zm1.06 8.132a6.5 6.5 0 10-9.192 0l3.535 3.536a1.5 1.5 0 002.122 0l3.535-3.536zM8 9a2 2 0 100-4 2 2 0 000 4z"/></svg>
            Vietnam
          </span>
          <span>
            <svg viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1h-6a1 1 0 00-1 1v6.708A2.486 2.486 0 017.5 9h5V1.5z"/></svg>
            28 repos
          </span>
          <span>
            <svg viewBox="0 0 16 16"><path d="M2 5.5a3.5 3.5 0 115.898 2.549 5.507 5.507 0 013.034 4.084.75.75 0 11-1.482.235 4.001 4.001 0 00-7.9 0 .75.75 0 01-1.482-.236A5.507 5.507 0 013.102 8.05 3.49 3.49 0 012 5.5zM11 4a.75.75 0 100 1.5 1.5 1.5 0 01.666 2.844.75.75 0 00-.416.672v.352a.75.75 0 00.574.73c1.2.289 2.162 1.2 2.522 2.372a.75.75 0 101.434-.44 5.01 5.01 0 00-2.56-3.012A3 3 0 0011 4z"/></svg>
            19 followers · 128 following
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter Nav -->
  <nav class="nav">
    <button class="nav-btn active" onclick="filterRepos('all')">All Projects</button>
    <button class="nav-btn" onclick="filterRepos('original')">Original</button>
    <button class="nav-btn" onclick="filterRepos('fork')">Contributions (Forks)</button>
  </nav>

  <main class="container">

    <!-- Stats -->
    <section style="margin-bottom:2.5rem;">
      <h2 class="section-title">Overview</h2>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num">28</div><div class="stat-label">Public Repos</div></div>
        <div class="stat-card"><div class="stat-num">10</div><div class="stat-label">Original Projects</div></div>
        <div class="stat-card"><div class="stat-num">18</div><div class="stat-label">Contributions</div></div>
        <div class="stat-card"><div class="stat-num">19</div><div class="stat-label">Followers</div></div>
      </div>

      <!-- Language bar -->
      <div class="lang-bar-container">
        <div class="lang-bar">
          <div style="background:#f1e05a;flex:35%" title="JavaScript"></div>
          <div style="background:#3178c6;flex:20%" title="TypeScript"></div>
          <div style="background:#e34c26;flex:15%" title="HTML"></div>
          <div style="background:#b07219;flex:10%" title="Java"></div>
          <div style="background:#f34b7d;flex:8%" title="C++"></div>
          <div style="background:#259b24;flex:7%" title="mcfunction"></div>
          <div style="background:#8b949e;flex:5%" title="Other"></div>
        </div>
        <div class="lang-legend">
          <span><span class="lang-dot" style="background:#f1e05a"></span> JavaScript</span>
          <span><span class="lang-dot" style="background:#3178c6"></span> TypeScript</span>
          <span><span class="lang-dot" style="background:#e34c26"></span> HTML</span>
          <span><span class="lang-dot" style="background:#b07219"></span> Java</span>
          <span><span class="lang-dot" style="background:#f34b7d"></span> C++</span>
          <span><span class="lang-dot" style="background:#259b24"></span> mcfunction</span>
        </div>
      </div>
    </section>

    <!-- Projects -->
    <section>
      <h2 class="section-title" id="projects-title">Projects</h2>
      <div class="repo-grid" id="repo-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Built by Designation Vee · <a href="https://github.com/Senthemodder" target="_blank">github.com/Senthemodder</a></p>
    <p style="margin-top:.5rem;">© 2026</p>
  </footer>

  <script>
    const LANG_COLORS = {
      JavaScript: '#f1e05a', TypeScript: '#3178c6', HTML: '#e34c26',
      Java: '#b07219', 'C++': '#f34b7d', mcfunction: '#259b24',
      Python: '#3572A5', CSS: '#563d7c', Shell: '#89e051'
    };

    const repos = [
      // ── Original projects ──
      { name: 'aquarium-of-gullibles', desc: 'Adversarial Autonomous Agent Benchmark & Invariant Simulation Lab [Verified Escrow]', lang: 'TypeScript', stars: 0, forks: 11, fork: false, url: 'https://github.com/Senthemodder/aquarium-of-gullibles' },
      { name: 'pdf_docx_converter', desc: 'A simple PDF ↔ DOCX converter web tool.', lang: 'HTML', stars: 0, forks: 0, fork: false, url: 'https://github.com/Senthemodder/pdf_docx_converter' },
      { name: 'hybrid-yt-downloader', desc: 'A hybrid YouTube downloader tool.', lang: 'JavaScript', stars: 0, forks: 0, fork: false, url: 'https://github.com/Senthemodder/hybrid-yt-downloader' },
      { name: 'DownGit', desc: 'Download GitHub folders and files without cloning. Browser-based, no server.', lang: 'JavaScript', stars: 0, forks: 0, fork: false, url: 'https://github.com/Senthemodder/DownGit' },
      { name: 'UnitCalc', desc: 'Fast, clean unit converter with 41+ conversion calculators. Browser-based, no server.', lang: 'JavaScript', stars: 0, forks: 0, fork: false, url: 'https://github.com/Senthemodder/UnitCalc' },
      { name: 'ConvertFast', desc: 'Free browser-based file conversion tools. No upload, no server, no BS.', lang: 'HTML', stars: 0, forks: 0, fork: false, url: 'https://github.com/Senthemodder/ConvertFast' },
      { name: 'bedrock-fluids-generator', desc: 'Simple generator for Minecraft Bedrock fluids.', lang: 'JavaScript', stars: 1, forks: 0, fork: false, url: 'https://github.com/Senthemodder/bedrock-fluids-generator' },
      { name: 'Teraphobia-Reloaded', desc: 'Minecraft Bedrock adventure map / add-on project.', lang: 'mcfunction', stars: 0, forks: 0, fork: false, url: 'https://github.com/Senthemodder/Teraphobia-Reloaded' },

      // ── Forks / Contributions ──
      { name: 'Sendly-Test-Repo', desc: 'Webhook for GitHub agent.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/Sendly-Test-Repo' },
      { name: 'zec-bounties', desc: 'Bounty Platform with Native ZEC Payments.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/zec-bounties' },
      { name: 'pay.ubq.fi', desc: 'Generate and claim spender permits (EIP-2612).', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/pay.ubq.fi' },
      { name: 'command-start-stop', desc: 'Manager user commands to assign / un-assign themselves to tasks.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/command-start-stop' },
      { name: 'genshin-party-web', desc: 'Genshin Impact party builder web app.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/genshin-party-web' },
      { name: 'text-conversation-rewards', desc: 'Text conversation rewards system.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/text-conversation-rewards' },
      { name: 'lily-frontend', desc: 'Frontend for the Lily platform.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/lily-frontend' },
      { name: 'lily-backend', desc: 'Backend for the Lily platform.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/lily-backend' },
      { name: 'veridion', desc: 'Open-source AI-powered smart contract security platform — analyze contracts, detect vulnerabilities, generate audit reports on Stellar.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/veridion' },
      { name: 'lily-sdk', desc: 'SDK for the Lily platform.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/lily-sdk' },
      { name: 'fluxer', desc: 'Free and open-source instant messaging and VoIP chat app.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/fluxer' },
      { name: 'agentlily-runtime', desc: 'Runtime for AgentLily.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/agentlily-runtime' },
      { name: 'riscvmc2', desc: 'An Addon precompiler that compiles RISC-V instructions into Minecraft Scripting API.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/riscvmc2' },
      { name: 'Cosmos-Adventure', desc: 'Cosmos Adventure — a Minecraft adventure project.', lang: 'JavaScript', stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/Cosmos-Adventure' },
      { name: 'aseprite', desc: 'Animated sprite editor & pixel art tool (Windows, macOS, Linux).', lang: 'C++', stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/aseprite' },
      { name: 'Realistic-Animals-Addon', desc: 'Adds birds, ducks, makes chickens and some mobs more realistic.', lang: null, stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/Realistic-Animals-Addon' },
      { name: 'Galacticraft', desc: 'The classic space mod, rewritten for modern versions of Minecraft.', lang: 'Java', stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/Galacticraft' },
      { name: 'Gaia-Dimension', desc: 'A mod about a shiny dimension with lore. Made for fun.', lang: 'Java', stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/Gaia-Dimension' },
      { name: 'gaia-dimension-be', desc: 'Gaia Dimension — Bedrock Edition port.', lang: 'JavaScript', stars: 0, forks: 0, fork: true, url: 'https://github.com/Senthemodder/gaia-dimension-be' },
    ];

    const repoIcon = `<svg viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1h-6a1 1 0 00-1 1v6.708A2.486 2.486 0 017.5 9h5V1.5z"/></svg>`;
    const forkIcon = `<svg viewBox="0 0 16 16"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"/></svg>`;
    const starIcon = `<svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>`;

    function renderRepos(filter) {
      const grid = document.getElementById('repo-grid');
      const title = document.getElementById('projects-title');
      let filtered = repos;
      if (filter === 'original') filtered = repos.filter(r => !r.fork);
      else if (filter === 'fork') filtered = repos.filter(r => r.fork);
      
      title.textContent = filter === 'all' ? 'All Projects' : filter === 'original' ? 'Original Projects' : 'Contributions (Forks)';

      grid.innerHTML = filtered.map(r => `
        <a class="repo-card" href="${r.url}" target="_blank" style="text-decoration:none;color:inherit" data-fork="${r.fork}">
          <div class="repo-name">${r.fork ? forkIcon : repoIcon} ${r.name}</div>
          <div class="repo-desc">${r.desc || 'No description'}</div>
          <div class="repo-meta">
            ${r.lang ? `<span><span class="lang-dot" style="background:${LANG_COLORS[r.lang]||'#8b949e'}"></span>${r.lang}</span>` : ''}
            ${r.stars ? `<span>${starIcon} ${r.stars}</span>` : ''}
            ${r.forks ? `<span>${forkIcon} ${r.forks}</span>` : ''}
            ${r.fork ? '<span class="badge">fork</span>' : ''}
          </div>
        </a>
      `).join('');
    }

    function filterRepos(filter) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderRepos(filter);
    }

    // Initial render
    renderRepos('all');
  </script>
</body>
</html>
